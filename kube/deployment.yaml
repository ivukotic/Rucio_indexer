apiVersion: apps/v1
kind: Deployment
metadata:
  name: rucio-indexer
  namespace: collectors
  labels:
    app: rucio-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rucio-indexer
  template:
    metadata:
      labels:
        app: rucio-indexer
    spec:
      containers:
        - name: rucio-indexer
          image: ivukotic/rucio_indexer:latest
          command: ["python"]
          args: ["RUCIO_indexer.py"]
          env:
            - name: MQ_USER
              valueFrom:
                secretKeyRef:
                  name: fts
                  key: mq_user
            - name: MQ_PASS
              valueFrom:
                secretKeyRef:
                  name: fts
                  key: mq_pass
            - name: MQ_HOST
              valueFrom:
                secretKeyRef:
                  name: fts
                  key: rucio_mq_host
            - name: ES_USER
              valueFrom:
                secretKeyRef:
                  name: fts
                  key: es_user
            - name: ES_PASS
              valueFrom:
                secretKeyRef:
                  name: fts
                  key: es_pass
            - name: ES_HOST
              valueFrom:
                secretKeyRef:
                  name: fts
                  key: es_host
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
